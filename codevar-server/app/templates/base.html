<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CodeVAR{% endblock %}</title>
    <meta
      name="description"
      content="Mini error-tracker para aplicaciones FastAPI: captura, agrupa y expone excepciones no manejadas."
    />
    <link rel="icon" type="image/png" href="/static/CodeVarIco.png" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">
        <img
          src="/static/CodeVarIco.png"
          alt="CodeVAR"
          class="brand-mark"
          width="28"
          height="28"
        />
        <span class="brand-word">Code<strong>VAR</strong></span>
      </a>
      <nav class="site-nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"
          >Proyectos</a
        >
        {% if api_key %}
        <a
          href="/dashboard?api_key={{ api_key }}"
          class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}"
          >Errores</a
        >
        {% endif %}
      </nav>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <script src="/static/app.js"></script>
  </body>
</html>
